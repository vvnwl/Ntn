<html> 
<head>
    <link href="https://fonts.google.com/specimen/Qwitcher+Grypen?preview.text=Good%20Morning,%20James&categoryFilters=Calligraphy:%2FScript%2FHandwritten;Feeling:%2FExpressive%2FArtistic" rel="stylesheet">
    <title>Greeting Message</title> 
    <style>
#lbl {
    font-family: 'Qwitcher Gryphen';
    font-size: x-large;
    color: #fff;
    padding: 10px 25px 10px 25px;
    border: 1px solid #ececec;
    text-align: center;
    line-height: 1.5;
    height:85%
    display: inline-block;
    box-shadown: 2px 2px 1px 0px #70665c

.full-table {
    display: table;
    height: 100%;
    width: 100%;
}

.table-cell {
    display: table-cell;
    vertical-align: middle;
    text-align: center;

}
        
#date{
    font-size:large;
    display: inline;
    min-width: 162px: 
    font-family: 'Cinzel';
    padding-right: 30px
}
body{
    background-color: #B2A496;
}
    </style>
</head>
<body>
    
    <div id="lbl"></div>
</body>

<script>
    var weekday = new Array(7);
    weekday[0] = "Sunday";
    weekday[1] = "Monday";
    weekday[2] = "Tuesday";
    weekday[3] = "Wednesday";
    weekday[4] = "Thursday";
    weekday[5] = "Friday";
    weekday[6] = "Saturday";

    
    var today = new Date();
    var hrs = today.getHours();
    var dayOfWeek = weekday[today.getDay()];
    var date = dayOfWeek+" " + today.getDate() + "/" +(today.getMonth()+1) +'/'+today.getFullYear()  ;

    var greet;

    if (hrs < 12)
        greet = 'Good Morning,  ';
    else if (hrs >= 12 && hrs <= 17)
        greet = 'Good Afternoon, ';
    else if (hrs >= 17 && hrs <= 24)
        greet = 'Good Evening,  ';

    document.getElementById('lbl').innerHTML =
        greet+= "James " + `<div id="date"> It's ${date}</div>`;
</script> 
</html>
